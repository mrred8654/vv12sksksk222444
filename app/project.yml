name: AquaVR
options:
  bundleIdPrefix: com.mrred8654
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
targets:
  AquaVR:
    type: application
    platform: iOS
    sources:
      - path: Sources
    settings:
      base:
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: NO
        ENABLE_TESTABILITY: NO
    info:
      path: Info.plist
      properties:
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        CFBundleDisplayName: AquaVR
        NSLocalNetworkUsageDescription: "AquaVR принимает USB-туннель на локальных портах 9943/9944."
schemes:
  AquaVR:
    build:
      targets:
        AquaVR: all
