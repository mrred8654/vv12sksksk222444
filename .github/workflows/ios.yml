name: iOS build (unsigned IPA)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: app
        run: xcodegen generate

      - name: Build (unsigned, iphoneos)
        working-directory: app
        run: |
          xcodebuild \
            -project AquaVR.xcodeproj \
            -scheme AquaVR \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Package unsigned IPA
        run: |
          APP_PATH=$(find app/build/Build/Products/Release-iphoneos -maxdepth 1 -name "*.app")
          echo "Found app: $APP_PATH"
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -qry AquaVR-unsigned.ipa Payload
          mkdir -p artifacts
          mv AquaVR-unsigned.ipa artifacts/

      - uses: actions/upload-artifact@v4
        with:
          name: AquaVR-unsigned-ipa
          path: artifacts/AquaVR-unsigned.ipa
          retention-days: 30
